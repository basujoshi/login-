<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{max-width:420px;margin:15vh auto;background:#fff;padding:30px;border-radius:18px;text-align:center;box-shadow:0 10px 35px #0001}.login button{border:0;background:#111827;color:#fff;padding:12px 15px;border-radius:10px}.layout{height:100vh;display:grid;grid-template-columns:310px 1fr;background:#fff}.side{border-right:1px solid #e1e6ed;display:flex;flex-direction:column}.sidehead{padding:14px;border-bottom:1px solid #e1e6ed}.search{width:100%;padding:10px;border:1px solid #d5dce6;border-radius:10px}.users{overflow:auto}.user{display:flex;gap:9px;padding:11px;border-bottom:1px solid #f0f2f5;cursor:pointer}.user.active,.user:hover{background:#eef5ff}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#e5e7eb}.info{flex:1;min-width:0}.info b,.info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:12px;color:#697386;margin-top:3px}.chat{display:flex;flex-direction:column;min-width:0}.top{display:flex;gap:9px;align-items:center;padding:11px 13px;border-bottom:1px solid #e1e6ed}.online{color:#16a34a!important}.offline{color:#7b8493!important}.top button{border:0;border-radius:9px;padding:8px;background:#111827;color:#fff}.details{padding:9px 13px;background:#f8fafc;border-bottom:1px solid #edf0f4;font-size:12px;color:#566274}.details b{color:#172033}.messages{flex:1;overflow:auto;padding:14px;background:#eef3f8}.row{display:flex;gap:7px;margin:7px 0;align-items:flex-end}.mine{justify-content:flex-end}.mine .small{order:2}.small{width:30px;height:30px;border-radius:50%;object-fit:cover}.bubble{max-width:78%;background:#fff;border-radius:15px;padding:9px 11px;box-shadow:0 1px 3px #0001;word-break:break-word}.mine .bubble{background:#dbeafe;border-bottom-right-radius:5px}.row:not(.mine) .bubble{border-bottom-left-radius:5px}.media{max-width:280px;width:100%;border-radius:10px}.bubble audio{max-width:280px;width:100%}.text{white-space:pre-wrap}.meta{font-size:10px;color:#778294;text-align:right;margin-top:4px}.readline{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;color:#667085;font-size:10px}.readline img{width:16px;height:16px;border-radius:50%;object-fit:cover}.actions{text-align:right}.actions button{font-size:10px;border:0;background:transparent;color:#2563eb}.actions .del{color:#dc2626}.deleted{font-style:italic;color:#7d8795}.typing{min-height:20px;padding:0 14px;font-size:12px;color:#687486}.composer{padding:8px;border-top:1px solid #e1e6ed}.compose{display:flex;gap:6px}.compose input{flex:1;border:1px solid #d4dbe5;border-radius:22px;padding:11px 14px}.icon{width:42px;border:0;border-radius:50%;background:#edf1f6}.send{background:#2563eb;color:#fff}.recording{background:#dc2626;color:#fff}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:none}.side.show{display:flex;position:absolute;z-index:5;width:86%;height:100%;background:#fff}.menu{display:block!important}}
.menu{display:none}
</style></head><body>
<div id="login" class="login hidden"><h2>Admin Panel</h2><p>Only authorized admin can access.</p><button id="google">Continue with Google</button><p>Admin: joshibasu12345@gmail.com</p></div>
<div id="layout" class="layout hidden"><aside id="side" class="side"><div class="sidehead"><h2>Customers</h2><input id="search" class="search" placeholder="Search name or Gmail"></div><div id="users" class="users"></div></aside>
<main class="chat"><div class="top"><button id="menu" class="menu">☰</button><img id="avatar" class="avatar"><div class="info"><b id="cname">Select customer</b><span id="status" class="offline">Offline</span></div><button id="notify">🔔</button><button id="logout">Logout</button></div>
<div id="details" class="details hidden"></div><div id="messages" class="messages"><div style="margin:auto;color:#7a8493">Select a customer.</div></div><div id="typing" class="typing"></div>
<div class="composer"><div class="compose"><input id="input" placeholder="Type a message..." disabled><input id="photo" type="file" accept="image/*" hidden><button id="photoBtn" class="icon" disabled>📷</button><button id="voiceBtn" class="icon" disabled>🎙️</button><button id="send" class="icon send" disabled>➤</button></div></div></main></div>
<script type="module">
import {auth,db,provider,signInWithPopup,onAuthStateChanged,signOut,ref,update,push,onValue,onDisconnect,serverTimestamp} from "./firebase-config.js";
const ADMIN="joshibasu12345@gmail.com",$=x=>document.getElementById(x);let me,selected,users=[],ids=new Set(),msgOff,presOff,typeOff,timer,rec,chunks;
const avatar=(u,n="User")=>u||"https://ui-avatars.com/api/?name="+encodeURIComponent(n)+"&background=e5e7eb&color=374151";
const dataURL=(f,max)=>new Promise((res,rej)=>{if(f.size>max)return rej("size");let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
const notify=(t,b)=>{if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(t,{body:b})};
function presence(){let p=ref(db,"presence/admin");update(p,{online:true,lastSeen:serverTimestamp(),photo:me.photoURL||"",name:me.displayName||"Admin"});onDisconnect(p).update({online:false,lastSeen:serverTimestamp()})}
function load(){onValue(ref(db,"users"),s=>{users=Object.values(s.val()||{}).filter(x=>x?.uid&&x.email);drawUsers()})}
function drawUsers(){let q=$("search").value.toLowerCase();$("users").innerHTML="";users.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.email||"").toLowerCase().includes(q)).sort((a,b)=>(b.lastLoginAt||0)-(a.lastLoginAt||0)).forEach(u=>{let d=document.createElement("div");d.className="user "+(selected?.uid===u.uid?"active":"");d.innerHTML=`<img class="avatar" src="${avatar(u.photo,u.name)}"><div class="info"><b>${u.name||"Customer"}</b><span>${u.email}</span></div>`;d.onclick=()=>select(u);$("users").append(d)})}
function select(u){selected=u;$("side").classList.remove("show");$("avatar").src=avatar(u.photo,u.name);$("cname").textContent=u.name||u.email;$("details").classList.remove("hidden");$("details").innerHTML=`<b>Customer Details</b> · Contact: ${u.contact||"-"} · WhatsApp: ${u.whatsapp||"-"} · Reason: ${u.reason||"-"} · Gmail: ${u.email||"-"}`;["input","photoBtn","voiceBtn","send"].forEach(x=>$(x).disabled=false);ids=new Set();msgOff?.();presOff?.();typeOff?.();
msgOff=onValue(ref(db,"messages/"+u.uid),s=>{let d=s.val()||{},a=Object.entries(d).map(([id,m])=>({...m,id}));a.forEach(m=>{if(!ids.has(m.id)&&m.senderRole==="customer")notify(u.name||"Customer",m.type==="text"?m.text:"New "+m.type+" message")});ids=new Set(a.map(x=>x.id));let up={};a.forEach(m=>{if(m.senderRole==="customer"&&!m.seenByAdmin)up[m.id+"/seenByAdmin"]=true});if(Object.keys(up).length)update(ref(db,"messages/"+u.uid),up);render(d)});
presOff=onValue(ref(db,"presence/"+u.uid),s=>{let p=s.val();$("status").textContent=p?.online?"Online":"Offline";$("status").className=p?.online?"online":"offline"});
typeOff=onValue(ref(db,"typing/"+u.uid+"/customer"),s=>$("typing").textContent=s.val()?.typing?(u.name||"Customer")+" is typing…":"" ) }
function render(d){let b=$("messages");b.innerHTML="";Object.entries(d).map(([id,m])=>({...m,id})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)).forEach(m=>{let r=document.createElement("div");r.className="row "+(m.senderRole==="admin"?"mine":"");let av=document.createElement("img");av.className="small";av.src=avatar(m.senderPhoto||(m.senderRole==="admin"?me.photoURL:selected?.photo),m.senderRole==="admin"?"Admin":selected?.name);let bb=document.createElement("div");bb.className="bubble";if(m.deleted)bb.innerHTML='<div class="deleted">This message was deleted</div>';else if(m.type==="image"){let x=document.createElement("img");x.className="media";x.src=m.data;bb.append(x)}else if(m.type==="voice"){let x=document.createElement("audio");x.controls=true;x.src=m.data;bb.append(x)}else{let x=document.createElement("div");x.className="text";x.textContent=m.text||"";bb.append(x)}let meta=document.createElement("div");meta.className="meta";meta.textContent=(m.senderRole==="admin"?"You":"Customer")+(m.edited?" · Edited":"")+(m.senderRole==="admin"?" · "+(m.seenByCustomer?"Read":"Sent"):"");bb.append(meta);
 if(m.senderRole==="admin" && m.seenByCustomer){let rd=document.createElement("div");rd.className="readline";let ra=document.createElement("img");ra.src=avatar(selected?.photo,selected?.name||"Customer");ra.title="Customer read";let rt=document.createElement("span");rt.textContent="Read";rd.append(ra,rt);bb.append(rd);}if(m.senderRole==="admin"&&!m.deleted&&m.timestamp&&Date.now()-m.timestamp<60000){let ac=document.createElement("div");ac.className="actions";if(m.type==="text"){let e=document.createElement("button");e.textContent="Edit";e.onclick=async()=>{let v=prompt("Edit message:",m.text||"");if(v?.trim())await update(ref(db,"messages/"+selected.uid+"/"+m.id),{text:v.trim(),edited:true})};ac.append(e)}let q=document.createElement("button");q.textContent="Delete";q.className="del";q.onclick=async()=>{if(confirm("Delete this message?"))await update(ref(db,"messages/"+selected.uid+"/"+m.id),{deleted:true,text:"",data:""})};ac.append(q);bb.append(ac)}r.append(av,bb);b.append(r)});b.scrollTop=b.scrollHeight}
async function send(t){t=t?.trim();if(!t||!selected)return;await push(ref(db,"messages/"+selected.uid),{senderUid:me.uid,senderEmail:me.email,senderName:me.displayName||"Admin",senderPhoto:me.photoURL||"",senderRole:"admin",type:"text",text:t,timestamp:serverTimestamp(),seenByCustomer:false,seenByAdmin:true})}
$("google").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){alert(e.message)}};$("logout").onclick=()=>signOut(auth);$("search").oninput=drawUsers;$("menu").onclick=()=>$("side").classList.toggle("show");$("notify").onclick=()=>{"Notification"in window&&Notification.requestPermission()};$("send").onclick=()=>{send($("input").value);$("input").value=""};$("input").oninput=()=>{if(!selected)return;update(ref(db,"typing/"+selected.uid+"/admin"),{typing:true,at:serverTimestamp()});clearTimeout(timer);timer=setTimeout(()=>update(ref(db,"typing/"+selected.uid+"/admin"),{typing:false}),900)};$("input").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("send").click()}};
$("photoBtn").onclick=()=>$("photo").click();$("photo").onchange=async e=>{let f=e.target.files[0];if(!f||!selected)return;if(f.size>700*1024)return alert("Photo maximum 700KB.");try{let data=await dataURL(f,700*1024);await push(ref(db,"messages/"+selected.uid),{senderUid:me.uid,senderEmail:me.email,senderName:me.displayName||"Admin",senderPhoto:me.photoURL||"",senderRole:"admin",type:"image",data,timestamp:serverTimestamp(),seenByCustomer:false,seenByAdmin:true})}catch(_){alert("Photo could not be saved.")}e.target.value=""};
$("voiceBtn").onclick=async()=>{if(rec?.state==="recording"){rec.stop();$("voiceBtn").textContent="🎙️";return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:"audio/webm"});if(blob.size>450*1024)return alert("Voice too large. Record a shorter voice.");let data=await dataURL(blob,450*1024);await push(ref(db,"messages/"+selected.uid),{senderUid:me.uid,senderEmail:me.email,senderName:me.displayName||"Admin",senderPhoto:me.photoURL||"",senderRole:"admin",type:"voice",data,timestamp:serverTimestamp(),seenByCustomer:false,seenByAdmin:true})};rec.start();$("voiceBtn").textContent="⏹️"}catch(e){alert("Microphone permission is required.")}};
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("layout").classList.add("hidden");return}if((u.email||"").toLowerCase()!==ADMIN){alert("Access denied.");return signOut(auth)}me=u;$("login").classList.add("hidden");$("layout").classList.remove("hidden");presence();load();if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()});
</script></body></html>
