<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Customer Panel</title><style>\n
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#152033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.top{height:64px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:19px}.sub{font-size:12px;opacity:.7}.btn{background:#2563eb;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.btn.red{background:#dc2626}.btn.gray{background:#374151}
.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
.login{max-width:480px;margin:70px auto;padding:30px;text-align:center}.login h1{margin:0 0 8px}.login p{color:#64748b}.google{width:100%;padding:13px;border-radius:11px;background:#fff;border:1px solid #d7dce5;font-weight:700}
.form{padding:20px;max-width:720px;margin:25px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select{padding:12px;border:1px solid #d7dee9;border-radius:10px;outline:none}.field input:focus,.field select:focus{border-color:#2563eb}.msg{margin:10px 0;padding:10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;display:none}
.app{display:none;height:calc(100vh - 64px);min-height:560px}.app:not(.hidden){display:block}.layout{display:grid;grid-template-columns:330px 1fr;height:100%}.side{background:#fff;border-right:1px solid #e5e7eb;overflow:auto}.sideHead{padding:15px;border-bottom:1px solid #edf0f4}.search{width:100%;padding:11px;border:1px solid #d7dee9;border-radius:10px}.userItem{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid #f0f2f5;align-items:center}.userItem.active{background:#eff6ff}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:none}.avatar.sm{width:24px;height:24px}.userInfo{min-width:0;flex:1}.userInfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userInfo span{font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8}.dot.on{background:#22c55e}
.chat{display:flex;flex-direction:column;min-width:0;background:#f8fafc}.chatHead{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}.chatHead .info{flex:1}.chatHead small{color:#64748b}.profilePanel{padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:none}.profilePanel.show{display:block}.profileRow{display:flex;gap:14px;align-items:center}.profileBig{width:64px;height:64px;border-radius:50%;object-fit:cover}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;font-size:13px}.detail{background:#f8fafc;border-radius:8px;padding:8px}.detail b{display:block;font-size:11px;color:#64748b;margin-bottom:2px}
.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.empty{margin:auto;text-align:center;color:#64748b}.bubbleRow{display:flex;gap:7px;max-width:80%;align-items:flex-end}.bubbleRow.me{margin-left:auto;flex-direction:row-reverse}.bubble{padding:9px 11px;border-radius:14px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 2px 5px rgba(0,0,0,.03);word-break:break-word}.bubbleRow.me .bubble{background:#2563eb;color:#fff;border-color:#2563eb}.bubble img.media{max-width:280px;max-height:260px;border-radius:10px;display:block}.bubble audio{max-width:250px}.meta{font-size:10px;margin-top:4px;opacity:.72;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.readAvatar{width:17px;height:17px;border-radius:50%;object-fit:cover;vertical-align:middle}.typing{height:22px;padding:0 18px;color:#64748b;font-size:12px}.composer{background:#fff;border-top:1px solid #e5e7eb;padding:10px;display:flex;gap:8px;align-items:center}.composer input{flex:1;padding:11px 13px;border:1px solid #d7dee9;border-radius:22px;outline:none}.iconBtn{width:42px;height:42px;border-radius:50%;background:#eef2f7}.send{background:#2563eb;color:#fff}.preview{max-width:60px;max-height:60px;border-radius:8px}.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{height:42%;border-right:0;border-bottom:1px solid #e5e7eb}.chat{height:58%}.grid,.details{grid-template-columns:1fr}.field.full{grid-column:auto}.bubbleRow{max-width:92%}.app{height:calc(100vh - 64px)}}
\n
/* Final mobile/chat polish */
@media(max-width:760px){
  .top{height:58px;padding:0 10px}.brand{font-size:16px}.sub{font-size:10px}
  .app{height:calc(100dvh - 58px);min-height:0}
  .layout{height:100%;grid-template-columns:1fr}
  .side{height:34%;min-height:190px}
  .chat{height:66%;min-height:0}
  .messages{padding:12px 9px}
  .composer{padding:7px;gap:5px}
  .composer input{min-width:0}
  .iconBtn{width:38px;height:38px}
  .bubbleRow{max-width:94%}
  .bubble img.media{max-width:220px;max-height:220px}
}
</style></head>
<body>
<header class="top"><div><div class="brand">Admin Customer Panel</div><div class="sub">Only joshibasu12345@gmail.com</div></div><button id="logout" class="btn red hidden">Logout</button></header>
<section id="loginBox" class="card login"><h1>Admin Login</h1><p>Only authorized Gmail can enter.</p><button id="googleLogin" class="google">🔵 Continue with Google</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="app"><div class="layout">
<aside class="side"><div class="sideHead"><b>Customers</b><div style="height:8px"></div><input id="search" class="search" placeholder="Search name or Gmail..."></div><div id="userList"></div></aside>
<main class="chat"><div id="chatHead" class="chatHead"><div class="empty">Select a customer</div></div>
<div id="profilePanel" class="profilePanel"></div><div id="messages" class="messages"><div class="empty">Select a customer to see messages.</div></div><div id="typing" class="typing"></div>
<div class="composer"><input id="textInput" placeholder="Write a message..." disabled><input id="photoInput" type="file" accept="image/*" class="hidden"><button id="photoBtn" class="iconBtn" disabled>📷</button><button id="voiceBtn" class="iconBtn" disabled>🎤</button><button id="sendBtn" class="iconBtn send" disabled>➤</button></div>
</main></div></section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, setPersistence, browserLocalPersistence, GoogleAuthProvider,
  signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getDatabase, ref, set, update, push, onValue, onDisconnect,
  serverTimestamp, remove
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyA0C8ZAlYUZQM4UYs49xBhyMHwArJDLJpA",
  authDomain: "website-a091e.firebaseapp.com",
  databaseURL: "https://website-a091e-default-rtdb.firebaseio.com",
  projectId: "website-a091e",
  storageBucket: "website-a091e.firebasestorage.app",
  messagingSenderId: "204226900375",
  appId: "1:204226900375:web:2edc07a4db0a90fa4b14d2",
  measurementId: "G-WNSLPLBJB2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account",login_hint:"joshibasu12345@gmail.com"});
provider.setCustomParameters({ prompt: "select_account" });
await setPersistence(auth, browserLocalPersistence);
const ADMIN="joshibasu12345@gmail.com",MAX_PHOTO=700*1024,MAX_VOICE=450*1024;
const $=id=>document.getElementById(id);let me=null,customers={},selected=null,stopUsers=null,stopMsgs=null,stopPresence=null,stopTyping=null,recording=false,recorder=null,chunks=[];
const show=(e,y=true)=>e.classList.toggle("hidden",!y);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const time=t=>t?new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"...";
const notify=(title,body)=>{if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(title,{body})};
async function askNotify(){if("Notification"in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch{}}
$("googleLogin").onclick=async()=>{try{const r=await signInWithPopup(auth,provider);if(r.user.email?.toLowerCase()!==ADMIN.toLowerCase()){alert("Access denied. Only "+ADMIN+" is allowed.");await signOut(auth)}else await askNotify()}catch(e){$("loginMsg").textContent=e.message||"Login failed";$("loginMsg").style.display="block"}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){
   me=null;show($("loginBox"));show($("app"),false);show($("logout"),false);return;
 }
 const email=(user.email||"").toLowerCase();
 if(email!=="joshibasu12345@gmail.com"){
   try{await signOut(auth)}catch{}
   me=null;show($("loginBox"));show($("app"),false);show($("logout"),false);
   $("loginMsg").textContent="Access denied. Only joshibasu12345@gmail.com is allowed.";
   $("loginMsg").style.display="block";
   return;
 }
 me=user;
 show($("loginBox"),false);show($("app"));show($("logout"));
 await set(ref(db,"adminProfile"),{name:user.displayName||"Admin",email:ADMIN,photo:user.photoURL||""});
 listenUsers();await adminPresence(true);
 onValue(ref(db,"users"),async s=>{
   const all=s.val()||{};
   for(const [uid,u] of Object.entries(all)){
     if(u?.uid && u.contact && u.whatsapp && u.reason){
       try{await sendAdminAutoGreeting(uid,u)}catch(e){console.error(e)}
     }
   }
 },{onlyOnce:true});
});
async function adminPresence(online){const p=ref(db,"presence/admin");await onDisconnect(p).set({online:false,lastSeen:serverTimestamp()});await set(p,{online,lastSeen:serverTimestamp()})}
function listenUsers(){
 if(stopUsers)stopUsers();
 stopUsers=onValue(ref(db,"users"),snap=>{
   customers=snap.val()||{};
   renderUsers();
 });
}
$("search").oninput=renderUsers;
function renderUsers(){
 const q=$("search").value.trim().toLowerCase();const arr=Object.values(customers)
 .filter(u=>u&&u.uid&&u.email&&u.contact&&u.whatsapp&&u.reason)
 .filter(u=>!q||`${u.name||""} ${u.email||""}`.toLowerCase().includes(q))
 .sort((a,b)=>(Number(b.submittedAt)||0)-(Number(a.submittedAt)||0));
 const box=$("userList");box.innerHTML="";
 if(!arr.length){box.innerHTML='<div class="empty" style="padding:30px">No submitted customers.</div>';return}
 for(const u of arr){const el=document.createElement("div");el.className="userItem"+(selected===u.uid?" active":"");el.onclick=()=>selectUser(u.uid);
 el.innerHTML=`<img class="avatar" src="${u.photo||""}"><div class="userInfo"><b>${esc(u.name||"Customer")}</b><span>${esc(u.email||"")}</span><span>${esc(u.contact||"")} · ${esc(u.reason||"")}</span></div><span id="dot-${u.uid}" class="dot"></span>`;box.appendChild(el);listenOnePresence(u.uid)}
}
function listenOnePresence(uid){onValue(ref(db,"presence/"+uid),s=>{const d=s.val();const x=document.getElementById("dot-"+uid);if(x)x.classList.toggle("on",!!d?.online)},{onlyOnce:false})}
async function sendAdminAutoGreeting(uid, profile){
  if(!uid || !profile || !me || (me.email||"").toLowerCase()!=="joshibasu12345@gmail.com") return;
  const msgRef = ref(db,"adminAutoGreeting/"+uid);
  const already = await new Promise(resolve => onValue(msgRef,s=>resolve(s.val()),{onlyOnce:true}));
  if(already?.sent) return;

  const text = `Hello ${profile.name||"Customer"}, your details have been received successfully. We will contact you soon.`;
  const r = push(ref(db,"messages/"+uid));
  await set(r,{
    senderRole:"admin",
    senderUid:me.uid,
    senderName:me.displayName||"Admin",
    senderPhoto:me.photoURL||"",
    type:"text",
    text,
    timestamp:serverTimestamp(),
    seenByAdmin:true,
    seenByCustomer:false,
    automatic:true
  });
  await set(msgRef,{sent:true,sentAt:serverTimestamp()});
}

function selectUser(uid){
 selected=uid;const u=customers[uid];if(!u)return;renderUsers();$("chatHead").innerHTML=`<img class="avatar" style="width:50px;height:50px" src="${u.photo||""}"><div class="info"><b>${esc(u.name||"Customer")}</b><br><small id="status">Loading...</small></div><button id="profileBtn" class="btn gray">Details</button>`;$("profileBtn").onclick=()=>{$("profilePanel").classList.toggle("show")};
 $("profilePanel").innerHTML=`<div class="profileRow"><img class="profileBig" src="${u.photo||""}"><div><b>${esc(u.name||"Customer")}</b><div>${esc(u.email||"")}</div></div></div><div class="details"><div class="detail"><b>Contact</b>${esc(u.contact||"-")}</div><div class="detail"><b>WhatsApp</b>${esc(u.whatsapp||"-")}</div><div class="detail"><b>Reason</b>${esc(u.reason||"-")}</div><div class="detail"><b>UID</b>${esc(u.uid)}</div></div>`;$("profilePanel").classList.add("show");
 $("textInput").disabled=false;$("photoBtn").disabled=false;$("voiceBtn").disabled=false;$("sendBtn").disabled=false;listenMessages(uid);listenTyping(uid);listenStatus(uid);
}
function listenStatus(uid){if(stopPresence)stopPresence();stopPresence=onValue(ref(db,"presence/"+uid),s=>{$("status").textContent=s.val()?.online?"Online":"Offline"})}
function listenTyping(uid){if(stopTyping)stopTyping();stopTyping=onValue(ref(db,"typing/"+uid+"/customer"),s=>{$("typing").textContent=s.val()?.typing?(customers[uid]?.name||"Customer")+" is typing…":""})}
function listenMessages(uid){
 if(stopMsgs)stopMsgs();stopMsgs=onValue(ref(db,"messages/"+uid),snap=>{
  const raw=snap.val()||{},arr=Object.entries(raw).map(([id,v])=>({id,...v})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));const box=$("messages");box.innerHTML="";
  if(!arr.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}
  arr.forEach(m=>{
   if(m.senderRole==="customer"&&!m.seenByAdmin)update(ref(db,"messages/"+uid+"/"+m.id),{seenByAdmin:true,readByPhoto:me.photoURL||""}).catch(()=>{});
   const mine=m.senderRole==="admin",row=document.createElement("div");row.className="bubbleRow "+(mine?"me":"");
   const av=document.createElement("img");av.className="avatar sm";av.src=mine?(customers[uid]?.photo||""):(me.photoURL||"");row.appendChild(av);
   const b=document.createElement("div");b.className="bubble";if(m.type==="photo")b.innerHTML=`<img class="media" src="${m.data}" alt="photo">`;else if(m.type==="voice")b.innerHTML=`<audio controls src="${m.data}"></audio>`;else b.innerHTML=esc(m.text);
   const meta=document.createElement("div");meta.className="meta";meta.innerHTML=time(m.timestamp);
   if(mine){meta.innerHTML+=" · "+(m.seenByCustomer?"Seen":"Sent");if(m.seenByCustomer){const x=document.createElement("img");x.className="readAvatar";x.src=m.readByPhoto||customers[uid]?.photo||"";meta.appendChild(x)}}
   else { meta.innerHTML+=" · Seen"; const x=document.createElement("img"); x.className="readAvatar"; x.src=me.photoURL||""; meta.appendChild(x); }
   if(mine&&m.timestamp&&Date.now()-m.timestamp<60000&&m.type==="text"){const ed=document.createElement("button");ed.textContent="Edit";ed.onclick=async()=>{const t=prompt("Edit message",m.text);if(t?.trim())await update(ref(db,"messages/"+uid+"/"+m.id),{text:t.trim(),edited:true})};const dl=document.createElement("button");dl.textContent="Delete";dl.onclick=async()=>{if(confirm("Delete message?"))await remove(ref(db,"messages/"+uid+"/"+m.id))};meta.append(ed,dl)}
   b.appendChild(meta);row.appendChild(b);box.appendChild(row);
  });box.scrollTop=box.scrollHeight;
 });
}
async function sendText(text){if(!selected||!text.trim())return;const r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderName:me.displayName||"Admin",senderPhoto:me.photoURL||"",type:"text",text:text.trim(),timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false})}
$("sendBtn").onclick=()=>sendText($("textInput").value).then(()=>{$("textInput").value="";set(ref(db,"typing/"+selected+"/admin"),{typing:false,at:serverTimestamp()})});
$("textInput").oninput=()=>{if(selected)set(ref(db,"typing/"+selected+"/admin"),{typing:!!$("textInput").value.trim(),at:serverTimestamp()})};
$("textInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("sendBtn").click()}};
$("photoBtn").onclick=()=>$("photoInput").click();
$("photoInput").onchange=async e=>{if(!selected)return;const f=e.target.files[0];if(!f)return;if(f.size>MAX_PHOTO){alert("Photo limit is 700 KB.");return}const data=await fileData(f);const r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"photo",data,timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false});e.target.value=""};
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$("voiceBtn").onclick=async()=>{if(!selected)return;if(recording){recorder.stop();recording=false;$("voiceBtn").textContent="🎤";return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recording=true;$("voiceBtn").textContent="⏹️";recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>MAX_VOICE){alert("Voice limit is 450 KB.");return}const data=await fileData(blob),r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"voice",data,timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false})};recorder.start()}catch(e){alert("Microphone permission is required.")}};
</script></body></html>
