<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;font:15px Arial;color:#172033}header{background:#111827;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:330px 1fr;gap:15px}.card{background:white;padding:18px;border-radius:18px;box-shadow:0 6px 25px #0001}.customer{display:flex;gap:10px;align-items:center;border:1px solid #e0e5ed;padding:10px;border-radius:13px;margin:8px 0;cursor:pointer}.customer:hover{background:#f5f7fa}.avatar{width:55px;height:55px;border-radius:50%;object-fit:cover}.big{width:100px;height:100px;border-radius:50%;object-fit:cover}.small{font-size:12px;color:#687386}.hidden{display:none}.logout{background:#e53935;color:white;border:0;padding:10px 15px;border-radius:9px}.chat{height:400px;overflow:auto;background:#f5f7fa;padding:10px;border-radius:14px}.msg{max-width:75%;padding:10px;margin:7px 0;border-radius:14px;white-space:pre-wrap}.admin{margin-left:auto;background:#1769ff;color:white}.customerMsg{background:#e3e8f0}input,button{padding:12px;border-radius:9px;border:1px solid #d5dbe5}button{background:#1769ff;color:white;font-weight:bold;border:0}form{display:flex;gap:8px;margin-top:10px}form input{flex:1}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><b>Admin Customer Dashboard</b><button id="logout" class="logout">Logout</button></header><div class="wrap">
<div id="login" class="card hidden"><h2>Admin Login</h2><button id="loginBtn">Continue with Google</button><p id="err"></p></div>
<div id="dash" class="grid hidden"><div class="card"><h2>Customers</h2><div id="list">Loading...</div></div><div class="card"><div id="empty"><h2>Select Customer</h2><p>Click a customer photo/name.</p></div><div id="details" class="hidden"><img id="photo" class="big"><h2 id="name"></h2><p><b>Email:</b> <span id="email"></span></p><p><b>Phone:</b> <span id="phone"></span></p><p><b>WhatsApp:</b> <span id="wa"></span></p><p><b>Address:</b> <span id="address"></span></p><p><b>Service:</b> <span id="reason"></span></p><p><b>Requirement:</b> <span id="req"></span></p><hr><h2>💬 Real-Time Chat</h2><div id="chat" class="chat"></div><form id="chatForm"><input id="message" placeholder="Admin message..." required><button>Send</button></form></div></div></div></div>
<script type="module">
import{auth,db,provider,signInWithPopup,onAuthStateChanged,signOut,ref,onValue,push,set,serverTimestamp}from"./firebase-config.js";
const ADMIN="joshibasu12345@gmail.com";let selected=null;const $=x=>document.getElementById(x);
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){$("err").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(!u){$("login").classList.remove("hidden");$("dash").classList.add("hidden");return}if((u.email||"").toLowerCase()!==ADMIN){$("err").textContent="Access denied. Admin Gmail only.";signOut(auth);return}$("login").classList.add("hidden");$("dash").classList.remove("hidden");loadUsers()});
function loadUsers(){onValue(ref(db,"users"),s=>{let l=$("list");l.innerHTML="";if(!s.exists()){l.textContent="No customers yet.";return}s.forEach(x=>{let u=x.val();if(!u.uid)return;let d=document.createElement("div");d.className="customer";d.innerHTML='<img class="avatar" src="'+safe(u.photo||"https://via.placeholder.com/55")+'"><div><b>'+esc(u.name||"Unnamed")+'</b><div class="small">'+esc(u.email||"")+'</div><div class="small">'+esc(u.reason||"")+'</div></div>';d.onclick=()=>open(u.uid);l.appendChild(d)})})}
function open(uid){selected=uid;$("empty").classList.add("hidden");$("details").classList.remove("hidden");onValue(ref(db,"users/"+uid),s=>{let u=s.val()||{};$("photo").src=u.photo||"https://via.placeholder.com/100";$("name").textContent=u.name||"";$("email").textContent=u.email||"";$("phone").textContent=u.phone||"";$("wa").textContent=u.whatsapp||"";$("address").textContent=u.address||"";$("reason").textContent=u.reason||"";$("req").textContent=u.customMessage||""});onValue(ref(db,"messages/"+uid),s=>{let b=$("chat");b.innerHTML="";s.forEach(x=>{let m=x.val(),d=document.createElement("div");d.className="msg "+(m.senderRole==="admin"?"admin":"customerMsg");d.textContent=m.text||"";b.appendChild(d)});b.scrollTop=b.scrollHeight})}
$("chatForm").onsubmit=async e=>{e.preventDefault();let t=$("message").value.trim();if(!t||!selected)return;await set(push(ref(db,"messages/"+selected)),{senderUid:auth.currentUser.uid,senderEmail:auth.currentUser.email,senderRole:"admin",text:t,timestamp:serverTimestamp(),seenByCustomer:false});$("message").value=""};
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function safe(v){return esc(v).replace(/javascript:/gi,"")}
</script></body></html>
