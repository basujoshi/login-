<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Customer Panel</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div><div class="brand">Admin Customer Panel</div><div class="sub">Only joshibasu12345@gmail.com</div></div><button id="logout" class="btn red hidden">Logout</button></header>
<section id="loginBox" class="card login"><h1>Admin Login</h1><p>Only authorized Gmail can enter.</p><button id="googleLogin" class="google">🔵 Continue with Google</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="app"><div class="layout">
<aside class="side"><div class="sideHead"><b>Customers</b><div style="height:8px"></div><input id="search" class="search" placeholder="Search name or Gmail..."></div><div id="userList"></div></aside>
<main class="chat"><div id="chatHead" class="chatHead"><div class="empty">Select a customer</div></div>
<div id="profilePanel" class="profilePanel"></div><div id="messages" class="messages"><div class="empty">Select a customer to see messages.</div></div><div id="typing" class="typing"></div>
<div class="composer"><input id="textInput" placeholder="Write a message..." disabled><input id="photoInput" type="file" accept="image/*" class="hidden"><button id="photoBtn" class="iconBtn" disabled>📷</button><button id="voiceBtn" class="iconBtn" disabled>🎤</button><button id="sendBtn" class="iconBtn send" disabled>➤</button></div>
</main></div></section>
<script type="module">
import {auth,db,provider,signInWithPopup,onAuthStateChanged,signOut,ref,set,update,push,onValue,onDisconnect,serverTimestamp,remove} from "./firebase-config.js";
const ADMIN="joshibasu12345@gmail.com",MAX_PHOTO=700*1024,MAX_VOICE=450*1024;
const $=id=>document.getElementById(id);let me=null,customers={},selected=null,stopUsers=null,stopMsgs=null,stopPresence=null,stopTyping=null,recording=false,recorder=null,chunks=[];
const show=(e,y=true)=>e.classList.toggle("hidden",!y);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const time=t=>t?new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"...";
const notify=(title,body)=>{if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(title,{body})};
async function askNotify(){if("Notification"in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch{}}
$("googleLogin").onclick=async()=>{try{const r=await signInWithPopup(auth,provider);if(r.user.email?.toLowerCase()!==ADMIN.toLowerCase()){alert("Access denied. Only "+ADMIN+" is allowed.");await signOut(auth)}else await askNotify()}catch(e){$("loginMsg").textContent=e.message||"Login failed";$("loginMsg").style.display="block"}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){me=null;show($("loginBox"));show($("app"),false);show($("logout"),false);return}
 if(user.email?.toLowerCase()!==ADMIN.toLowerCase()){alert("Access denied.");await signOut(auth);return}
 me=user;show($("loginBox"),false);show($("app"));show($("logout"));listenUsers();await adminPresence(true);
});
async function adminPresence(online){const p=ref(db,"presence/admin");await onDisconnect(p).set({online:false,lastSeen:serverTimestamp()});await set(p,{online,lastSeen:serverTimestamp()})}
function listenUsers(){
 if(stopUsers)stopUsers();stopUsers=onValue(ref(db,"users"),snap=>{customers=snap.val()||{};renderUsers()});
}
$("search").oninput=renderUsers;
function renderUsers(){
 const q=$("search").value.trim().toLowerCase();const arr=Object.values(customers).filter(u=>u&&u.uid&&(u.contact||u.whatsapp||u.reason||u.submittedAt||u.email)).filter(u=>!q||`${u.name||""} ${u.email||""}`.toLowerCase().includes(q)).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
 const box=$("userList");box.innerHTML="";
 if(!arr.length){box.innerHTML='<div class="empty" style="padding:30px">No submitted customers.</div>';return}
 for(const u of arr){const el=document.createElement("div");el.className="userItem"+(selected===u.uid?" active":"");el.onclick=()=>selectUser(u.uid);
 el.innerHTML=`<img class="avatar" src="${u.photo||""}"><div class="userInfo"><b>${esc(u.name||"Customer")}</b><span>${esc(u.email||"")}</span></div><span id="dot-${u.uid}" class="dot"></span>`;box.appendChild(el);listenOnePresence(u.uid)}
}
function listenOnePresence(uid){onValue(ref(db,"presence/"+uid),s=>{const d=s.val();const x=document.getElementById("dot-"+uid);if(x)x.classList.toggle("on",!!d?.online)},{onlyOnce:false})}
function selectUser(uid){
 selected=uid;const u=customers[uid];if(!u)return;renderUsers();$("chatHead").innerHTML=`<img class="avatar" src="${u.photo||""}"><div class="info"><b>${esc(u.name||"Customer")}</b><br><small id="status">Loading...</small></div><button id="profileBtn" class="btn gray">Details</button>`;$("profileBtn").onclick=()=>{$("profilePanel").classList.toggle("show")};
 $("profilePanel").innerHTML=`<div class="profileRow"><img class="profileBig" src="${u.photo||""}"><div><b>${esc(u.name||"Customer")}</b><div>${esc(u.email||"")}</div></div></div><div class="details"><div class="detail"><b>Contact</b>${esc(u.contact||"-")}</div><div class="detail"><b>WhatsApp</b>${esc(u.whatsapp||"-")}</div><div class="detail"><b>Reason</b>${esc(u.reason||"-")}</div><div class="detail"><b>UID</b>${esc(u.uid)}</div></div>`;$("profilePanel").classList.add("show");
 $("textInput").disabled=false;$("photoBtn").disabled=false;$("voiceBtn").disabled=false;$("sendBtn").disabled=false;listenMessages(uid);listenTyping(uid);listenStatus(uid);
}
function listenStatus(uid){if(stopPresence)stopPresence();stopPresence=onValue(ref(db,"presence/"+uid),s=>{$("status").textContent=s.val()?.online?"Online":"Offline"})}
function listenTyping(uid){if(stopTyping)stopTyping();stopTyping=onValue(ref(db,"typing/"+uid+"/customer"),s=>{$("typing").textContent=s.val()?.typing?(customers[uid]?.name||"Customer")+" is typing…":""})}
function listenMessages(uid){
 if(stopMsgs)stopMsgs();stopMsgs=onValue(ref(db,"messages/"+uid),snap=>{
  const raw=snap.val()||{},arr=Object.entries(raw).map(([id,v])=>({id,...v})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));const box=$("messages");box.innerHTML="";
  if(!arr.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}
  arr.forEach(m=>{
   if(m.senderRole==="customer"&&!m.seenByAdmin)update(ref(db,"messages/"+uid+"/"+m.id),{seenByAdmin:true,readByPhoto:me.photoURL||""}).catch(()=>{});
   const mine=m.senderRole==="admin",row=document.createElement("div");row.className="bubbleRow "+(mine?"me":"");
   const av=document.createElement("img");av.className="avatar sm";av.src=mine?(me.photoURL||""):(m.senderPhoto||customers[uid]?.photo||"");row.appendChild(av);
   const b=document.createElement("div");b.className="bubble";if(m.type==="photo")b.innerHTML=`<img class="media" src="${m.data}" alt="photo">`;else if(m.type==="voice")b.innerHTML=`<audio controls src="${m.data}"></audio>`;else b.innerHTML=esc(m.text);
   const meta=document.createElement("div");meta.className="meta";meta.innerHTML=time(m.timestamp);
   if(mine){meta.innerHTML+=" · "+(m.seenByCustomer?"Read":"Sent");if(m.seenByCustomer){const x=document.createElement("img");x.className="readAvatar";x.src=m.readByPhoto||customers[uid]?.photo||"";meta.appendChild(x)}}
   if(mine&&m.timestamp&&Date.now()-m.timestamp<60000&&m.type==="text"){const ed=document.createElement("button");ed.textContent="Edit";ed.onclick=async()=>{const t=prompt("Edit message",m.text);if(t?.trim())await update(ref(db,"messages/"+uid+"/"+m.id),{text:t.trim(),edited:true})};const dl=document.createElement("button");dl.textContent="Delete";dl.onclick=async()=>{if(confirm("Delete message?"))await remove(ref(db,"messages/"+uid+"/"+m.id))};meta.append(ed,dl)}
   b.appendChild(meta);row.appendChild(b);box.appendChild(row);
  });box.scrollTop=box.scrollHeight;
 });
}
async function sendText(text){if(!selected||!text.trim())return;const r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderName:me.displayName||"Admin",senderPhoto:me.photoURL||"",type:"text",text:text.trim(),timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false})}
$("sendBtn").onclick=()=>sendText($("textInput").value).then(()=>{$("textInput").value="";set(ref(db,"typing/"+selected+"/admin"),{typing:false,at:serverTimestamp()})});
$("textInput").oninput=()=>{if(selected)set(ref(db,"typing/"+selected+"/admin"),{typing:!!$("textInput").value.trim(),at:serverTimestamp()})};
$("textInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("sendBtn").click()}};
$("photoBtn").onclick=()=>$("photoInput").click();
$("photoInput").onchange=async e=>{if(!selected)return;const f=e.target.files[0];if(!f)return;if(f.size>MAX_PHOTO){alert("Photo limit is 700 KB.");return}const data=await fileData(f);const r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"photo",data,timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false});e.target.value=""};
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$("voiceBtn").onclick=async()=>{if(!selected)return;if(recording){recorder.stop();recording=false;$("voiceBtn").textContent="🎤";return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recording=true;$("voiceBtn").textContent="⏹️";recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>MAX_VOICE){alert("Voice limit is 450 KB.");return}const data=await fileData(blob),r=push(ref(db,"messages/"+selected));await set(r,{senderRole:"admin",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"voice",data,timestamp:serverTimestamp(),seenByAdmin:true,seenByCustomer:false})};recorder.start()}catch(e){alert("Microphone permission is required.")}};
</script></body></html>
