<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Support</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;font:15px Arial;color:#172033}.wrap{max-width:720px;margin:auto;padding:15px}.card{background:white;padding:20px;margin:12px 0;border-radius:18px;box-shadow:0 6px 25px #0001}.center{text-align:center}.avatar{width:90px;height:90px;border-radius:50%;object-fit:cover}input,select,textarea,button{width:100%;padding:13px;margin:6px 0 12px;border-radius:10px;border:1px solid #d5dbe5;font-size:15px}button{border:0;background:#1769ff;color:white;font-weight:bold;cursor:pointer}.logout{background:#e53935}.hidden{display:none}.chat{height:360px;overflow:auto;background:#f5f7fa;padding:10px;border-radius:14px}.msg{max-width:78%;padding:10px;margin:7px 0;border-radius:14px;white-space:pre-wrap}.me{margin-left:auto;background:#1769ff;color:white}.them{background:#e3e8f0}.ok{color:#087f3f}.err{color:#c62828}</style></head><body><div class="wrap">
<div id="login" class="card center"><h1>Customer Login</h1><p>Continue with your Google account</p><button id="loginBtn">🔵 Continue with Google</button><p id="err"></p></div>
<div id="profile" class="card hidden"><div class="center"><img id="photo" class="avatar"><h2 id="googleName"></h2><p id="googleEmail"></p></div>
<form id="form"><label>Name</label><input id="name" required><label>Email</label><input id="email" readonly><label>Phone Number</label><input id="phone" type="tel" required><label>WhatsApp</label><input id="whatsapp" type="tel" required><label>Address</label><input id="address" required><label>Service / Reason</label><select id="reason" required><option value="">Select one</option><option>Website Developer</option><option>Software Developer</option><option>Shop Website</option><option>Billing Software</option><option>KhataPro Software</option><option>App</option><option>Custom Message</option></select><label>Custom Message / Requirement</label><textarea id="customMessage" rows="5" required></textarea><button>Submit Details</button></form><p id="status"></p><button id="logout" class="logout">Logout</button></div>
<div id="chatCard" class="card hidden"><h2>💬 Message Admin</h2><div id="chat" class="chat"></div><form id="chatForm"><input id="text" placeholder="Type message..." required><button>Send</button></form></div></div>
<script type="module">
import{auth,db,provider,signInWithPopup,onAuthStateChanged,signOut,ref,update,push,set,onValue,serverTimestamp}from"./firebase-config.js";
let u=null,chatStarted=false;const $=x=>document.getElementById(x);
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){$("err").textContent=e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{u=user;if(!user){$("login").classList.remove("hidden");$("profile").classList.add("hidden");$("chatCard").classList.add("hidden");return}
$("login").classList.add("hidden");$("profile").classList.remove("hidden");$("photo").src=user.photoURL||"https://via.placeholder.com/90";$("googleName").textContent=user.displayName||"Customer";$("googleEmail").textContent=user.email||"";$("name").value=user.displayName||"";$("email").value=user.email||"";
onValue(ref(db,"users/"+user.uid),s=>{let d=s.val();if(d){$("name").value=d.name||user.displayName||"";$("phone").value=d.phone||"";$("whatsapp").value=d.whatsapp||"";$("address").value=d.address||"";$("reason").value=d.reason||"";$("customMessage").value=d.customMessage||"";if(d.submitted){$("chatCard").classList.remove("hidden");startChat()}}})});
$("form").onsubmit=async e=>{e.preventDefault();if(!u)return;try{await update(ref(db,"users/"+u.uid),{uid:u.uid,name:$("name").value.trim(),email:u.email,photo:u.photoURL||"",phone:$("phone").value.trim(),whatsapp:$("whatsapp").value.trim(),address:$("address").value.trim(),reason:$("reason").value,customMessage:$("customMessage").value.trim(),submitted:true,updatedAt:serverTimestamp()});$("status").className="ok";$("status").textContent="Submitted successfully. You can now message admin.";$("chatCard").classList.remove("hidden");startChat()}catch(e){$("status").className="err";$("status").textContent=e.message}};
function startChat(){if(chatStarted)return;chatStarted=true;onValue(ref(db,"messages/"+u.uid),s=>{let b=$("chat");b.innerHTML="";s.forEach(x=>{let m=x.val(),d=document.createElement("div");d.className="msg "+(m.senderRole==="customer"?"me":"them");d.textContent=m.text||"";b.appendChild(d)});b.scrollTop=b.scrollHeight})}
$("chatForm").onsubmit=async e=>{e.preventDefault();let t=$("text").value.trim();if(!t||!u)return;await set(push(ref(db,"messages/"+u.uid)),{senderUid:u.uid,senderEmail:u.email,senderRole:"customer",text:t,timestamp:serverTimestamp(),seenByAdmin:false});$("text").value=""};
</script></body></html>
