<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Support</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div><div class="brand">Customer Support</div><div class="sub">Real-time chat</div></div><button id="logout" class="btn red hidden">Logout</button></header>

<section id="loginBox" class="card login"><h1>Welcome</h1><p>Continue with your Google account.</p><button id="googleLogin" class="google">🔵 Continue with Google</button><div id="loginMsg" class="msg"></div></section>

<section id="detailsBox" class="card form hidden">
<h2>Complete Your Details</h2><p>Please submit your details once. After submission, chat will open.</p>
<form id="detailsForm"><div class="grid">
<div class="field"><label>Name</label><input id="name" required></div>
<div class="field"><label>Gmail</label><input id="email" type="email" readonly></div>
<div class="field"><label>Contact Number</label><input id="contact" required></div>
<div class="field"><label>WhatsApp Number</label><input id="whatsapp" required></div>
<div class="field full"><label>Reason</label><select id="reason" required><option value="">Select reason</option><option>Website Developer</option><option>Software Developer</option><option>Shop Website</option><option>Billing Software</option><option>KhataPro Software</option><option>App Development</option><option>Website & App Development</option><option>Business Software</option><option>Other</option></select></div>
</div><div id="formMsg" class="msg"></div><button class="btn" type="submit">Submit & Open Chat</button></form>
</section>

<section id="app" class="app"><div class="chat">
<div class="chatHead"><img id="myAvatar" class="avatar" src="" alt=""><div class="info"><b id="myName"></b><br><small id="myStatus">Online</small></div><button id="quickBtn" class="btn gray">Quick</button></div>
<div id="messages" class="messages"><div class="empty">No messages yet.</div></div><div id="typing" class="typing"></div>
<div class="composer"><input id="textInput" placeholder="Write a message..."><input id="photoInput" type="file" accept="image/*" class="hidden"><button id="photoBtn" class="iconBtn">📷</button><button id="voiceBtn" class="iconBtn">🎤</button><button id="sendBtn" class="iconBtn send">➤</button></div>
</div></section>

<script type="module">
import {auth,db,provider,signInWithPopup,onAuthStateChanged,signOut,ref,set,update,push,onValue,onDisconnect,serverTimestamp,remove} from "./firebase-config.js";
const ADMIN="joshibasu12345@gmail.com", MAX_PHOTO=700*1024, MAX_VOICE=450*1024;
const $=id=>document.getElementById(id);
let me=null, stopMsgs=null, stopTyping=null, recording=false, recorder=null, chunks=[];

function show(el,yes=true){el.classList.toggle("hidden",!yes)}
function msg(el,t){el.textContent=t;el.style.display=t?"block":"none"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function time(t){return t?new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"..."}
function notify(title,body){if(document.hidden && "Notification" in window && Notification.permission==="granted") new Notification(title,{body})}
async function askNotify(){if("Notification" in window && Notification.permission==="default") try{await Notification.requestPermission()}catch{}}

$("googleLogin").onclick=async()=>{msg($("loginMsg"),"");try{await signInWithPopup(auth,provider);await askNotify()}catch(e){msg($("loginMsg"),e.message||"Google login failed")}};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){me=null;show($("loginBox"));show($("detailsBox"),false);show($("app"),false);show($("logout"),false);return}
 if(user.email?.toLowerCase()===ADMIN.toLowerCase()){msg($("loginMsg"),"Admin email cannot use customer page.");await signOut(auth);return}
 me=user;show($("loginBox"),false);show($("logout"));
 $("name").value=user.displayName||"";$("email").value=user.email||"";
 const snap=await new Promise(res=>onValue(ref(db,"users/"+user.uid),res,{onlyOnce:true}));
 const d=snap.val();
 if(d && d.contact && d.whatsapp && d.reason){openChat(d)}else{show($("detailsBox"));show($("app"),false)}
 await presence(true);
});

$("detailsForm").onsubmit=async e=>{
 e.preventDefault(); if(!me)return;
 const data={uid:me.uid,name:$("name").value.trim()||me.displayName||"Customer",email:me.email||"",contact:$("contact").value.trim(),whatsapp:$("whatsapp").value.trim(),reason:$("reason").value,photo:me.photoURL||"",submittedAt:serverTimestamp(),lastLoginAt:serverTimestamp(),loggedIn:true};
 try{await set(ref(db,"users/"+me.uid),data);await openChat(data)}catch(e){msg($("formMsg"),e.message||"Could not save details")}
};

async function presence(online){
 if(!me)return;const p=ref(db,"presence/"+me.uid);await onDisconnect(p).set({online:false,lastSeen:serverTimestamp()});await set(p,{online,lastSeen:serverTimestamp()});
}
window.addEventListener("beforeunload",()=>{if(me) set(ref(db,"presence/"+me.uid),{online:false,lastSeen:serverTimestamp()})});

async function openChat(profile){
 show($("detailsBox"),false);show($("app"));$("myAvatar").src=profile.photo||me.photoURL||"";$("myName").textContent=profile.name||me.displayName||"Customer";
 await presence(true); listenMessages(); listenTyping(); sendWelcomeIfEmpty();
}

function listenMessages(){
 if(stopMsgs)stopMsgs();
 stopMsgs=onValue(ref(db,"messages/"+me.uid),async snap=>{
   const raw=snap.val()||{};const arr=Object.entries(raw).map(([id,v])=>({id,...v})).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
   const box=$("messages");box.innerHTML="";
   if(!arr.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}
   for(const m of arr){
     if(m.senderRole==="admin" && !m.seenByCustomer) update(ref(db,"messages/"+me.uid+"/"+m.id),{seenByCustomer:true}).catch(()=>{});
     const mine=m.senderRole==="customer";const row=document.createElement("div");row.className="bubbleRow "+(mine?"me":"");
     const av=document.createElement("img");av.className="avatar sm";av.src=mine?(me.photoURL||""):(m.senderPhoto||"");row.appendChild(av);
     const b=document.createElement("div");b.className="bubble";
     if(m.type==="photo")b.innerHTML='<img class="media" src="'+m.data+'" alt="photo">';
     else if(m.type==="voice")b.innerHTML='<audio controls src="'+m.data+'"></audio>';
     else b.innerHTML=esc(m.text);
     const meta=document.createElement("div");meta.className="meta";meta.innerHTML=time(m.timestamp);
     if(mine){meta.innerHTML+=" · "+(m.seenByAdmin?"Read":"Sent");if(m.seenByAdmin){const x=document.createElement("img");x.className="readAvatar";x.src=m.readByPhoto||"";meta.appendChild(x)}}
     if(mine && m.timestamp && Date.now()-m.timestamp<60000 && m.type==="text"){
       const ed=document.createElement("button");ed.textContent="Edit";ed.style.fontSize="10px";ed.onclick=async()=>{const t=prompt("Edit message",m.text);if(t!==null&&t.trim())await update(ref(db,"messages/"+me.uid+"/"+m.id),{text:t.trim(),edited:true})};
       const dl=document.createElement("button");dl.textContent="Delete";dl.style.fontSize="10px";dl.onclick=async()=>{if(confirm("Delete message?"))await remove(ref(db,"messages/"+me.uid+"/"+m.id))};meta.append(ed,dl);
     }
     b.appendChild(meta);row.appendChild(b);box.appendChild(row);
   }
   box.scrollTop=box.scrollHeight;
 });
}
function listenTyping(){
 if(stopTyping)stopTyping();stopTyping=onValue(ref(db,"typing/"+me.uid+"/admin"),s=>{$("typing").textContent=s.val()?.typing?"Admin is typing…":""});
}
let lastAuto=false;
async function sendWelcomeIfEmpty(){
 const s=await new Promise(res=>onValue(ref(db,"messages/"+me.uid),res,{onlyOnce:true}));
 if(!s.exists() && !lastAuto){lastAuto=true;await sendText("Hello! How can I help you?")}
}
async function sendText(text){
 if(!text.trim())return;const r=push(ref(db,"messages/"+me.uid));await set(r,{senderRole:"customer",senderUid:me.uid,senderName:me.displayName||"Customer",senderPhoto:me.photoURL||"",type:"text",text:text.trim(),timestamp:serverTimestamp(),seenByAdmin:false,seenByCustomer:true});
}
$("sendBtn").onclick=()=>sendText($("textInput").value).then(()=>{$("textInput").value=""});
$("textInput").oninput=async()=>{await set(ref(db,"typing/"+me.uid+"/customer"),{typing:!!$("textInput").value.trim(),at:serverTimestamp()})};
$("textInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("sendBtn").click()}};
$("photoBtn").onclick=()=>$("photoInput").click();
$("photoInput").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>MAX_PHOTO){alert("Photo limit is 700 KB.");e.target.value="";return}const data=await fileData(f);const r=push(ref(db,"messages/"+me.uid));await set(r,{senderRole:"customer",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"photo",data,timestamp:serverTimestamp(),seenByAdmin:false,seenByCustomer:true});e.target.value=""};
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$("voiceBtn").onclick=async()=>{
 if(recording){recorder.stop();recording=false;$("voiceBtn").textContent="🎤";return}
 if(!navigator.mediaDevices?.getUserMedia){alert("Voice recording is not supported.");return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recording=true;$("voiceBtn").textContent="⏹️";
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});if(blob.size>MAX_VOICE){alert("Voice limit is 450 KB.");return}const data=await fileData(blob);const r=push(ref(db,"messages/"+me.uid));await set(r,{senderRole:"customer",senderUid:me.uid,senderPhoto:me.photoURL||"",type:"voice",data,timestamp:serverTimestamp(),seenByAdmin:false,seenByCustomer:true})};recorder.start();
 }catch(e){alert("Microphone permission is required.")}
};
$("quickBtn").onclick=async()=>{const t=prompt("Quick reply:\n1 = Hello\n2 = I need website\n3 = I need software\n4 = Thank you");if(t==="1")sendText("Hello");else if(t==="2")sendText("I need a website.");else if(t==="3")sendText("I need software.");else if(t==="4")sendText("Thank you.");};
</script></body></html>
